# Q6(b): capital W in the base-frame yz plane, x = 0.650 m.
# Size: 0.080 m wide and 0.140 m tall, matching the S drawing area.
# Each time is a segment duration in seconds, not an absolute arrival time.
# Planned duration: 6 s approach + 12 x 1 s drawing segments = 18 s.
# Draw one continuous stroke: down, up to the centre, down, then up to the right.
# All waypoint targets lie on the plane; no pen-up feature is required.
joint_names:
  - fr3_joint1
  - fr3_joint2
  - fr3_joint3
  - fr3_joint4
  - fr3_joint5
  - fr3_joint6
  - fr3_joint7

